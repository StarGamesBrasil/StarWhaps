<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarWhaps - Pro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b141a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #e9edef;
    }

    /* Tela de Autenticação */
    #auth-screen {
      background-color: #111b21;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    #auth-screen h1 { color: #0088cc; margin-bottom: 5px; }
    #auth-screen p { color: #8696a0; margin-bottom: 20px; font-size: 0.9rem; }

    .tab-header { display: flex; border-bottom: 2px solid #2a3942; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px 0; background: none; border: none; font-weight: 600; color: #8696a0; cursor: pointer; }
    .tab-btn.active { color: #0088cc; border-bottom: 2px solid #0088cc; }
    .form-content { display: none; }
    .form-content.active { display: block; }

    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; margin-bottom: 5px; color: #8696a0; font-size: 0.85rem; }
    .input-group input, .input-group select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #2a3942; background: #202c33; color: #e9edef; outline: none; }

    .btn-main { width: 100%; padding: 10px; border: none; border-radius: 8px; background-color: #0088cc; color: white; font-weight: bold; cursor: pointer; margin-top: 5px; }
    .btn-main:hover { background-color: #006699; }

    /* App Principal */
    #app-container {
      display: none;
      width: 100%;
      max-width: 1100px;
      height: 92vh;
      background-color: #111b21;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      position: relative;
    }

    /* Overlay escuro quando a barra lateral está aberta */
    #sidebar-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 90;
    }

    #sidebar-overlay.active {
      display: block;
    }

    /* Sidebar Retrátil (Menu Lateral Drawer) */
    #sidebar {
      position: absolute;
      top: 0;
      left: -320px;
      width: 320px;
      height: 100%;
      background-color: #111b21;
      border-right: 1px solid #2a3942;
      display: flex;
      flex-direction: column;
      z-index: 100;
      transition: left 0.3s ease;
    }

    #sidebar.open {
      left: 0;
    }

    .sidebar-header {
      padding: 15px;
      background-color: #202c33;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-bottom: 1px solid #2a3942;
    }

    .sidebar-header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-close-sidebar {
      background: none;
      border: none;
      color: #8696a0;
      font-size: 1.2rem;
      cursor: pointer;
    }
    .btn-close-sidebar:hover { color: #e9edef; }

    .section-title {
      padding: 10px 15px 5px;
      font-size: 0.8rem;
      color: #0088cc;
      text-transform: uppercase;
      font-weight: bold;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
    }

    .chat-item {
      padding: 12px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      border-bottom: 1px solid #1f2c34;
    }

    .chat-item:hover, .chat-item.active { background-color: #2a3942; }
    .chat-item-info { display: flex; flex-direction: column; }
    .chat-item-name { font-weight: 600; font-size: 0.95rem; }
    .chat-item-sub { font-size: 0.75rem; color: #8696a0; }

    /* Área do Chat */
    #chat-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #0b141a;
      width: 100%;
    }

    header {
      background: #202c33;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a3942;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-menu-toggle {
      background: none;
      border: none;
      color: #0088cc;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    .header-info h2 { font-size: 1rem; }
    .header-info p { font-size: 0.75rem; color: #8696a0; }
    .header-actions { display: flex; gap: 8px; }

    #message-area {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background-color: #080d11;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 70%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      word-wrap: break-word;
      position: relative;
    }

    .message.received { background-color: #202c33; align-self: flex-start; }
    .message.sent { background-color: #005c8a; align-self: flex-end; }
    .message.announcement { background-color: #5c3d00; border: 1px solid #ffb703; align-self: center; width: 90%; text-align: center; }

    .message-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .username { font-size: 0.75rem; font-weight: bold; color: #38b6ff; }
    .user-tag { background: #2a3942; color: #e9edef; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; }
    .timestamp { font-size: 0.65rem; color: #8696a0; }

    .btn-delete-msg {
      background: none;
      border: none;
      color: #8696a0;
      cursor: pointer;
      font-size: 0.75rem;
      margin-left: 8px;
      transition: color 0.2s;
    }
    .btn-delete-msg:hover {
      color: #e63946;
    }

    .media-preview { max-width: 100%; max-height: 250px; border-radius: 6px; margin-top: 5px; }

    /* Enquete */
    .poll-box {
      background: #182229;
      border: 1px solid #2a3942;
      border-radius: 8px;
      padding: 10px;
      margin-top: 5px;
    }
    .poll-option {
      background: #202c33;
      padding: 8px;
      margin: 5px 0;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
    }
    .poll-option:hover { background: #2a3942; }

    footer {
      background-color: #202c33;
      padding: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    footer input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background-color: #2a3942;
      color: #e9edef;
      outline: none;
    }

    .btn-small {
      background-color: #0088cc;
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.8rem;
    }

    .btn-small:hover { background-color: #006699; }
    .btn-danger { background-color: #e63946; }
    .btn-danger:hover { background-color: #b71c1c; }
    .btn-warning { background-color: #ffb703; color: #000; }
    .btn-admin { background-color: #7209b7; }

    /* Modais */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #111b21;
      padding: 20px;
      border-radius: 8px;
      width: 450px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .member-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #2a3942;
    }
  </style>
</head>
<body>

  <div id="auth-screen">
    <h1>StarWhaps</h1>
    <p>Painel Avançado de Comunicação</p>

    <div class="tab-header">
      <button class="tab-btn active" id="btn-tab-login">Entrar</button>
      <button class="tab-btn" id="btn-tab-reg">Cadastrar</button>
    </div>

    <form id="login-form" class="form-content active">
      <div class="input-group">
        <label>E-mail</label>
        <input type="email" id="login-email" required>
      </div>
      <div class="input-group">
        <label>Senha</label>
        <input type="password" id="login-pass" required>
      </div>
      <button type="submit" class="btn-main">Entrar</button>
    </form>

    <form id="register-form" class="form-content">
      <div class="input-group">
        <label>Nome / Apelido</label>
        <input type="text" id="reg-username" required>
      </div>
      <div class="input-group">
        <label>E-mail</label>
        <input type="email" id="reg-email" required>
      </div>
      <div class="input-group">
        <label>Senha</label>
        <input type="password" id="reg-pass" minlength="6" required>
      </div>
      <button type="submit" class="btn-main">Cadastrar</button>
    </form>
  </div>

  <div id="app-container">
    <div id="sidebar-overlay"></div>

    <div id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-header-top">
          <strong id="my-profile-name">Perfil</strong>
          <button id="btn-close-sidebar" class="btn-close-sidebar">✕</button>
        </div>
        <button id="btn-super-admin" class="btn-small btn-admin" style="display: none;">⚡ Super Admin</button>
        <button id="btn-create-group" class="btn-small">+ Criar Grupo</button>
      </div>

      <div class="section-title">Canais & Grupos</div>
      <div class="chat-list" id="groups-list"></div>

      <div class="section-title">Mensagens Diretas (DMs)</div>
      <div class="chat-list" id="users-list"></div>
    </div>

    <div id="chat-screen">
      <header>
        <div class="header-left">
          <button id="btn-menu-toggle" class="btn-menu-toggle" title="Abrir menu">☰</button>
          <div class="header-info">
            <h2 id="chat-title">Selecione um Chat</h2>
            <p id="chat-subtitle"></p>
          </div>
        </div>
        <div class="header-actions">
          <button id="btn-block-user" class="btn-small btn-danger" style="display: none;">Bloquear</button>
          <button id="btn-leave-group" class="btn-small btn-danger" style="display: none;">Sair do Grupo</button>
          <button id="btn-create-poll" class="btn-small btn-warning" style="display: none;">Criar Enquete</button>

          <button id="btn-manage-group" class="btn-small" style="display: none;">Gerenciar Grupo</button>
        </div>
      </header>

      <div id="message-area"></div>

      <footer>
        <input type="file" id="file-input" style="display: none;" accept="image/*,video/*,.pdf,.doc,.docx,.txt">
        <button id="btn-attach" class="btn-small" style="background: #2a3942;">📎</button>
        <input type="text" id="message-input" placeholder="Digite uma mensagem..." autocomplete="off">
        <button id="send-btn" class="btn-small">Enviar</button>
      </footer>
    </div>
  </div>

  <div id="group-manage-modal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 15px;">Gerenciar Grupo</h3>
      
      <h4>Mandar Aviso em Destaque</h4>
      <div class="input-group" style="margin-top: 5px;">
        <input type="text" id="announcement-text" placeholder="Escreva o aviso oficial...">
        <button id="btn-send-announcement" class="btn-main btn-warning" style="margin-top: 5px;">Publicar Aviso</button>
      </div>

      <h4 style="margin-top: 15px;">Membros Atuais</h4>
      <div id="group-members-list" style="margin-bottom: 20px;"></div>

      <h4>Adicionar Usuários</h4>
      <div id="add-users-list"></div>
      
      <button onclick="closeModal('group-manage-modal')" class="btn-main" style="background: #2a3942; margin-top: 15px;">Fechar</button>
    </div>
  </div>

  <div id="poll-modal" class="modal">
    <div class="modal-content">
      <h3>Criar Enquete</h3>
      <div class="input-group" style="margin-top: 10px;">
        <label>Pergunta</label>
        <input type="text" id="poll-question" placeholder="Ex: Qual o dia da reunião?">
      </div>
      <div class="input-group">
        <label>Opções (separadas por vírgula)</label>
        <input type="text" id="poll-options" placeholder="Segunda, Terça, Quarta">
      </div>
      <div class="input-group">
        <label>Duração (Minutos - 0 para ilimitado)</label>
        <input type="number" id="poll-duration" value="0" min="0">
      </div>
      <div class="input-group">
        <label>Tipo de Votação</label>
        <select id="poll-anonymous">
          <option value="false">Pública (Mostra quem votou)</option>
          <option value="true">Anônima</option>
        </select>
      </div>
      <button id="btn-submit-poll" class="btn-main btn-warning">Lançar Enquete</button>
      <button onclick="closeModal('poll-modal')" class="btn-main" style="background: #2a3942;">Cancelar</button>
    </div>
  </div>

  <div id="admin-modal" class="modal">
    <div class="modal-content" style="width: 600px;">
      <h2 style="color: #7209b7; margin-bottom: 15px;">⚡ Painel Super Admin</h2>
      
      <h4>Gestão de Usuários Globais</h4>
      <div id="admin-users-list" style="max-height: 200px; overflow-y: auto; margin-bottom: 20px;"></div>

      <h4>Todos os Grupos do Sistema</h4>
      <div id="admin-groups-list" style="max-height: 200px; overflow-y: auto;"></div>

      <button onclick="closeModal('admin-modal')" class="btn-main" style="background: #2a3942; margin-top: 15px;">Fechar Painel</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA2eovVJ8yQ2miLQLQu6tK7RUH62WSf2S0",
      authDomain: "starwhaps.firebaseapp.com",
      projectId: "starwhaps",
      storageBucket: "starwhaps.firebasestorage.app",
      messagingSenderId: "273592072305",
      appId: "1:273592072305:web:7a866546930db45f3d83d0",
      measurementId: "G-NYEL446YS6"
    };

    const SUPER_ADMIN_UID = "7yN4QIB6baQIx9IaHmkQ1TGcrsE3"; 

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let userProfile = null;
    let activeChat = { type: 'global', id: 'global', name: 'Grupo Global' };
    let currentGroupData = null;
    let unsubscribeMessages = null;
    let attachedFileBase64 = null;
    let attachedFileType = null;

    // Elementos da Interface
    const authScreen = document.getElementById("auth-screen");
    const appContainer = document.getElementById("app-container");
    const messageArea = document.getElementById("message-area");
    const messageInput = document.getElementById("message-input");
    const fileInput = document.getElementById("file-input");

    // Controle da Barra Lateral Retrátil
    const sidebar = document.getElementById("sidebar");
    const sidebarOverlay = document.getElementById("sidebar-overlay");
    const btnMenuToggle = document.getElementById("btn-menu-toggle");
    const btnCloseSidebar = document.getElementById("btn-close-sidebar");

    function openSidebar() {
      sidebar.classList.add("open");
      sidebarOverlay.classList.add("active");
    }

    function closeSidebar() {
      sidebar.classList.remove("open");
      sidebarOverlay.classList.remove("active");
    }

    btnMenuToggle.onclick = openSidebar;
    btnCloseSidebar.onclick = closeSidebar;
    sidebarOverlay.onclick = closeSidebar;

    // Abas de Autenticação
    document.getElementById('btn-tab-login').onclick = () => switchTab('login');
    document.getElementById('btn-tab-reg').onclick = () => switchTab('register');

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.form-content').forEach(f => f.classList.remove('active'));
      if (tab === 'login') {
        document.getElementById('btn-tab-login').classList.add('active');
        document.getElementById('login-form').classList.add('active');
      } else {
        document.getElementById('btn-tab-reg').classList.add('active');
        document.getElementById('register-form').classList.add('active');
      }
    }

    // Login
    document.getElementById('login-form').onsubmit = async (e) => {
      e.preventDefault();
      try {
        const res = await signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-pass').value);
        currentUser = res.user;
        await checkUserStatusAndInit();
      } catch (err) { alert("Erro ao entrar: " + err.message); }
    };

    // Cadastro
    document.getElementById('register-form').onsubmit = async (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-username').value.trim();
      try {
        const res = await createUserWithEmailAndPassword(auth, document.getElementById('reg-email').value, document.getElementById('reg-pass').value);
        currentUser = res.user;
        await updateProfile(currentUser, { displayName: name });
        
        await setDoc(doc(db, "users", currentUser.uid), {
          uid: currentUser.uid,
          name: name,
          email: currentUser.email,
          banned: false,
          blockedUsers: []
        });

        await checkUserStatusAndInit();
      } catch (err) { alert("Erro ao cadastrar: " + err.message); }
    };

    // Verificar se a conta está banida
    async function checkUserStatusAndInit() {
      const userDoc = await getDoc(doc(db, "users", currentUser.uid));
      if (userDoc.exists() && userDoc.data().banned) {
        alert("Sua conta foi banida pelo Super Admin.");
        auth.signOut();
        return;
      }
      userProfile = userDoc.data() || {};
      initApp();
    }

    // Inicialização do App
    async function initApp() {
      authScreen.style.display = "none";
      appContainer.style.display = "flex";
      document.getElementById('my-profile-name').textContent = currentUser.displayName || "Usuário";

      if (currentUser.uid === SUPER_ADMIN_UID) {
        document.getElementById('btn-super-admin').style.display = 'block';
      }

      loadUsers();
      loadGroups();
      selectChat('global', 'Grupo Global', 'global');
    }

    // Carregar Usuários para DMs
    function loadUsers() {
      onSnapshot(collection(db, "users"), (snapshot) => {
        const list = document.getElementById('users-list');
        list.innerHTML = "";
        snapshot.forEach((docSnap) => {
          if (docSnap.exists()) {
            const user = docSnap.data();
            if (user.uid !== currentUser.uid && !user.banned) {
              const div = document.createElement('div');
              div.className = `chat-item ${activeChat.id === user.uid ? 'active' : ''}`;
              div.innerHTML = `<div class="chat-item-name">${user.name || "Usuário"}</div><div class="chat-item-sub">DM</div>`;
              div.onclick = () => selectChat(user.uid, user.name || "Usuário", 'dm');
              list.appendChild(div);
            }
          }
        });
      });
    }

    // Carregar Grupos
    function loadGroups() {
      onSnapshot(collection(db, "groups"), (snapshot) => {
        const list = document.getElementById('groups-list');
        list.innerHTML = "";

        const globalDiv = document.createElement('div');
        globalDiv.className = `chat-item ${activeChat.id === 'global' ? 'active' : ''}`;
        globalDiv.innerHTML = `<div class="chat-item-name">🌐 Grupo Global</div>`;
        globalDiv.onclick = () => selectChat('global', 'Grupo Global', 'global');
        list.appendChild(globalDiv);

        snapshot.forEach((docSnap) => {
          if (docSnap.exists()) {
            const group = { id: docSnap.id, ...docSnap.data() };
            const membersList = Array.isArray(group.members) ? group.members : [];

            if (membersList.includes(currentUser.uid) || currentUser.uid === SUPER_ADMIN_UID) {
              if (activeChat.id === group.id) {
                currentGroupData = group;
              }

              const div = document.createElement('div');
              div.className = `chat-item ${activeChat.id === group.id ? 'active' : ''}`;
              div.innerHTML = `
                <div class="chat-item-info">
                  <div class="chat-item-name">📢 ${group.name || "Grupo"}</div>
                  <div class="chat-item-sub">${group.ownerId === currentUser.uid ? 'Líder' : 'Membro'}</div>
                </div>`;
              div.onclick = () => selectChat(group.id, group.name || "Grupo", 'group', group);
              list.appendChild(div);
            }
          }
        });
      });
    }

    // Criar Grupo
    document.getElementById('btn-create-group').onclick = async () => {
      if (currentUser.uid !== SUPER_ADMIN_UID) {
        const q = query(collection(db, "groups"), where("ownerId", "==", currentUser.uid));
        const ownedGroups = await getDocs(q);

        if (ownedGroups.size >= 2) {
          alert("Você atingiu o limite de criação de 2 grupos!");
          return;
        }
      }

      const groupName = prompt("Digite o nome do novo grupo:");
      if (!groupName) return;

      await addDoc(collection(db, "groups"), {
        name: groupName,
        ownerId: currentUser.uid,
        members: [currentUser.uid],
        mutedMembers: [],
        tags: { [currentUser.uid]: "Líder" }
      });

      alert("Grupo criado com sucesso!");
    };

    // Selecionar Canal de Conversa
    function selectChat(id, name, type, groupData = null) {
      activeChat = { id, name, type };
      currentGroupData = groupData;

      document.getElementById('chat-title').textContent = name;
      document.getElementById('chat-subtitle').textContent = 
        type === 'dm' ? 'Mensagem Direta' : (type === 'global' ? 'Aberto a todos' : 'Grupo Privado');
      
      const manageBtn = document.getElementById('btn-manage-group');
      const pollBtn = document.getElementById('btn-create-poll');
      const leaveBtn = document.getElementById('btn-leave-group');
      const blockBtn = document.getElementById('btn-block-user');

      manageBtn.style.display = 'none';
      pollBtn.style.display = 'none';
      leaveBtn.style.display = 'none';
      blockBtn.style.display = 'none';

      if (type === 'group') {
        leaveBtn.style.display = 'block';
        if (currentGroupData && (currentGroupData.ownerId === currentUser.uid || currentUser.uid === SUPER_ADMIN_UID)) {
          manageBtn.style.display = 'block';
          pollBtn.style.display = 'block';
          manageBtn.onclick = () => openGroupManagement(currentGroupData);
        }
      } else if (type === 'dm') {
        blockBtn.style.display = 'block';
        const isBlocked = (userProfile.blockedUsers || []).includes(id);
        blockBtn.textContent = isBlocked ? 'Desbloquear' : 'Bloquear';
      }

      closeSidebar();
      listenMessages();
    }

    // Ouvir Mensagens
    function listenMessages() {
      if (unsubscribeMessages) unsubscribeMessages();
      messageArea.innerHTML = "";

      let targetChatId = activeChat.id;
      if (activeChat.type === 'dm') {
        targetChatId = [currentUser.uid, activeChat.id].sort().join("_");
      }

      const q = query(collection(db, "messages"), where("chatId", "==", targetChatId));

      unsubscribeMessages = onSnapshot(q, (snapshot) => {
        messageArea.innerHTML = "";
        const messages = [];

        snapshot.forEach((docSnap) => {
          if (docSnap.exists()) {
            const data = { id: docSnap.id, ...docSnap.data() };
            
            if (activeChat.type === 'dm') {
              const blockedList = userProfile.blockedUsers || [];
              if (blockedList.includes(activeChat.id) && data.senderId === activeChat.id) return;
            }
            messages.push(data);
          }
        });

        messages.sort((a, b) => {
          const timeA = a.timestamp ? a.timestamp.toMillis() : Date.now();
          const timeB = b.timestamp ? b.timestamp.toMillis() : Date.now();
          return timeA - timeB;
        });

        messages.forEach((msg) => renderMessage(msg));
        messageArea.scrollTop = messageArea.scrollHeight;
      });
    }

    // Anexo de Arquivos
    document.getElementById('btn-attach').onclick = () => fileInput.click();
    fileInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      if (file.size > 5 * 1024 * 1024) {
        alert("O arquivo excede o limite de 5MB!");
        fileInput.value = "";
        return;
      }

      const reader = new FileReader();
      reader.onload = function(evt) {
        attachedFileBase64 = evt.target.result;
        attachedFileType = file.type.startsWith('image/') ? 'image' : (file.type.startsWith('video/') ? 'video' : 'file');
        alert(`Arquivo "${file.name}" anexado e pronto para envio!`);
      };
      reader.readAsDataURL(file);
    };

    // Enviar Mensagem
    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text && !attachedFileBase64) return;

      if (activeChat.type === 'group' && currentGroupData) {
        const mutedList = currentGroupData.mutedMembers || [];
        if (mutedList.includes(currentUser.uid)) {
          alert("Você está silenciado neste grupo pelo líder!");
          return;
        }
      }

      let chatId = activeChat.id;
      if (activeChat.type === 'dm') {
        chatId = [currentUser.uid, activeChat.id].sort().join("_");
      }

      let tag = "";
      if (activeChat.type === 'group' && currentGroupData && currentGroupData.tags) {
        tag = currentGroupData.tags[currentUser.uid] || "";
      }

      await addDoc(collection(db, "messages"), {
        chatId: chatId,
        senderId: currentUser.uid,
        senderName: currentUser.displayName || "Usuário",
        text: text,
        media: attachedFileBase64 || null,
        mediaType: attachedFileType || null,
        tag: tag,
        type: 'standard',
        timestamp: serverTimestamp()
      });

      messageInput.value = "";
      attachedFileBase64 = null;
      attachedFileType = null;
      fileInput.value = "";
    }

    document.getElementById('send-btn').onclick = sendMessage;
    messageInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };

    // Renderizar Mensagens
    function renderMessage(msg) {
      const isMe = msg.senderId === currentUser.uid;
      const isGroupLeader = activeChat.type === 'group' && currentGroupData && (currentGroupData.ownerId === currentUser.uid || currentUser.uid === SUPER_ADMIN_UID);
      const canDelete = isMe || isGroupLeader;

      const div = document.createElement('div');
      div.className = `message ${msg.type === 'announcement' ? 'announcement' : (isMe ? 'sent' : 'received')}`;

      const time = msg.timestamp ? new Date(msg.timestamp.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '...';

      let mediaHtml = "";
      if (msg.media) {
        if (msg.mediaType === 'image') {
          mediaHtml = `<br><img src="${msg.media}" class="media-preview">`;
        } else if (msg.mediaType === 'video') {
          mediaHtml = `<br><video src="${msg.media}" controls class="media-preview"></video>`;
        } else {
          mediaHtml = `<br><a href="${msg.media}" download="arquivo" style="color: #38b6ff; text-decoration: underline;">📄 Baixar Arquivo Anexo</a>`;
        }
      }

      let pollHtml = "";
      if (msg.type === 'poll') {
        const poll = msg.poll;
        const totalVotes = Object.keys(poll.votes || {}).length;
        const expired = poll.expireAt && Date.now() > poll.expireAt;

        pollHtml = `<div class="poll-box">
          <strong>📊 ${poll.question}</strong>
          <small style="display:block; color:#8696a0;">${poll.anonymous ? 'Votação Anônima' : 'Votação Pública'} | Total: ${totalVotes} votos ${expired ? '(Encerrada)' : ''}</small>`;
          
        poll.options.forEach((opt, idx) => {
          const votesForOpt = Object.values(poll.votes || {}).filter(v => v.optIndex === idx).length;
          pollHtml += `
            <div class="poll-option" onclick="votePoll('${msg.id}', ${idx}, ${expired})">
              <span>${opt}</span>
              <strong>${votesForOpt}</strong>
            </div>`;
        });
        pollHtml += `</div>`;
      }

      div.innerHTML = `
        <div class="message-header">
          <span class="username">${msg.senderName}</span>
          ${msg.tag ? `<span class="user-tag">${msg.tag}</span>` : ''}
        </div>
        <div>${msg.text}</div>
        ${mediaHtml}
        ${pollHtml}
        <div style="display: flex; justify-content: flex-end; align-items: center; margin-top: 4px;">
          <span class="timestamp" style="margin-top: 0; flex: 1;">${time}</span>
          ${canDelete ? `<button class="btn-delete-msg" onclick="deleteMessage('${msg.id}')">🗑️ Apagar</button>` : ''}
        </div>
      `;

      messageArea.appendChild(div);
    }

    // Apagar Mensagem
    window.deleteMessage = async (msgId) => {
      if (!confirm("Deseja realmente apagar esta mensagem?")) return;
      try {
        await deleteDoc(doc(db, "messages", msgId));
      } catch (err) {
        alert("Erro ao apagar mensagem: " + err.message);
      }
    };

    // Votação na Enquete
    window.votePoll = async (msgId, optIndex, expired) => {
      if (expired) { alert("Esta enquete já expirou!"); return; }

      const msgRef = doc(db, "messages", msgId);
      const msgSnap = await getDoc(msgRef);
      if (msgSnap.exists()) {
        const poll = msgSnap.data().poll;
        poll.votes = poll.votes || {};
        poll.votes[currentUser.uid] = {
          optIndex: optIndex,
          voterName: poll.anonymous ? "Anônimo" : currentUser.displayName
        };

        await updateDoc(msgRef, { poll });
      }
    };

    // Criar Enquete
    document.getElementById('btn-create-poll').onclick = () => { document.getElementById('poll-modal').style.display = 'flex'; };
    document.getElementById('btn-submit-poll').onclick = async () => {
      const q = document.getElementById('poll-question').value.trim();
      const opts = document.getElementById('poll-options').value.split(',').map(o => o.trim()).filter(o => o);
      const duration = parseInt(document.getElementById('poll-duration').value);
      const isAnon = document.getElementById('poll-anonymous').value === 'true';

      if (!q || opts.length < 2) { alert("Preencha a pergunta e ao menos 2 opções!"); return; }

      const expireAt = duration > 0 ? Date.now() + (duration * 60 * 1000) : null;

      let chatId = activeChat.id;
      await addDoc(collection(db, "messages"), {
        chatId: chatId,
        senderId: currentUser.uid,
        senderName: currentUser.displayName,
        text: "Lançou uma enquete:",
        type: 'poll',
        poll: {
          question: q,
          options: opts,
          anonymous: isAnon,
          expireAt: expireAt,
          votes: {}
        },
        timestamp: serverTimestamp()
      });

      closeModal('poll-modal');
    };

    // Gestão do Grupo
    async function openGroupManagement(group) {
      document.getElementById('group-manage-modal').style.display = 'flex';
      
      document.getElementById('btn-send-announcement').onclick = async () => {
        const text = document.getElementById('announcement-text').value.trim();
        if (!text) return;
        await addDoc(collection(db, "messages"), {
          chatId: group.id,
          senderId: currentUser.uid,
          senderName: "LÍDER DO GRUPO",
          text: `📢 AVISO: ${text}`,
          type: 'announcement',
          timestamp: serverTimestamp()
        });
        document.getElementById('announcement-text').value = "";
        alert("Aviso enviado!");
      };

      const membersContainer = document.getElementById('group-members-list');
      membersContainer.innerHTML = "";

      for (let uid of group.members) {
        const userDoc = await getDoc(doc(db, "users", uid));
        if (userDoc.exists()) {
          const userData = userDoc.data();
          const userName = userData.name || "Usuário";
          const tag = (group.tags && group.tags[uid]) ? group.tags[uid] : "Membro";
          const isMuted = (group.mutedMembers || []).includes(uid);

          const div = document.createElement('div');
          div.className = 'member-item';
          div.innerHTML = `
            <div>
              <strong>${userName}</strong> <small>(${tag})</small>
            </div>
            <div>
              <button class="btn-small" onclick="toggleMuteMember('${group.id}', '${uid}')">${isMuted ? 'Dessilenciar' : 'Silenciar'}</button>
              <button class="btn-small" onclick="setTag('${group.id}', '${uid}')">Etiqueta</button>
              ${uid !== group.ownerId ? `<button class="btn-small btn-danger" onclick="removeMember('${group.id}', '${uid}')">Remover</button>` : ''}
            </div>
          `;
          membersContainer.appendChild(div);
        }
      }

      const addContainer = document.getElementById('add-users-list');
      addContainer.innerHTML = "";
      const allUsers = await getDocs(collection(db, "users"));

      allUsers.forEach((uDoc) => {
        if (uDoc.exists()) {
          const u = uDoc.data();
          if (!group.members.includes(u.uid) && !u.banned) {
            const div = document.createElement('div');
            div.className = 'member-item';
            div.innerHTML = `
              <span>${u.name || u.email}</span>
              <button class="btn-small" onclick="addMember('${group.id}', '${u.uid}')">Adicionar</button>
            `;
            addContainer.appendChild(div);
          }
        }
      });
    }

    // Ações do Líder
    window.toggleMuteMember = async (groupId, uid) => {
      const groupRef = doc(db, "groups", groupId);
      const groupDoc = await getDoc(groupRef);
      if (groupDoc.exists()) {
        let muted = groupDoc.data().mutedMembers || [];
        if (muted.includes(uid)) muted = muted.filter(m => m !== uid);
        else muted.push(uid);

        await updateDoc(groupRef, { mutedMembers: muted });
        alert("Status de silêncio alterado!");
        closeModal('group-manage-modal');
      }
    };

    window.addMember = async (groupId, uid) => {
      const groupRef = doc(db, "groups", groupId);
      const groupDoc = await getDoc(groupRef);
      if (groupDoc.exists()) {
        const members = groupDoc.data().members || [];
        members.push(uid);
        await updateDoc(groupRef, { members });
        alert("Membro adicionado!");
        closeModal('group-manage-modal');
      }
    };

    window.removeMember = async (groupId, uid) => {
      const groupRef = doc(db, "groups", groupId);
      const groupDoc = await getDoc(groupRef);
      if (groupDoc.exists()) {
        const members = (groupDoc.data().members || []).filter(m => m !== uid);
        await updateDoc(groupRef, { members });
        alert("Membro removido!");
        closeModal('group-manage-modal');
      }
    };

    window.setTag = async (groupId, uid) => {
      const newTag = prompt("Digite a etiqueta/cargo para este membro:");
      if (newTag === null) return;
      const groupRef = doc(db, "groups", groupId);
      const groupDoc = await getDoc(groupRef);
      if (groupDoc.exists()) {
        const tags = groupDoc.data().tags || {};
        tags[uid] = newTag;
        await updateDoc(groupRef, { tags });
        alert("Etiqueta atualizada!");
        closeModal('group-manage-modal');
      }
    };

    // Sair do Grupo
    document.getElementById('btn-leave-group').onclick = async () => {
      if (!confirm("Deseja mesmo sair deste grupo?")) return;
      const groupRef = doc(db, "groups", activeChat.id);
      const groupDoc = await getDoc(groupRef);
      if (groupDoc.exists()) {
        const members = (groupDoc.data().members || []).filter(m => m !== currentUser.uid);
        await updateDoc(groupRef, { members });
        selectChat('global', 'Grupo Global', 'global');
      }
    };

    // Bloquear Usuário
    document.getElementById('btn-block-user').onclick = async () => {
      const targetId = activeChat.id;
      let blocked = userProfile.blockedUsers || [];
      if (blocked.includes(targetId)) {
        blocked = blocked.filter(b => b !== targetId);
        alert("Usuário desbloqueado!");
      } else {
        blocked.push(targetId);
        alert("Usuário bloqueado!");
      }
      userProfile.blockedUsers = blocked;
      await updateDoc(doc(db, "users", currentUser.uid), { blockedUsers: blocked });
      selectChat(activeChat.id, activeChat.name, 'dm');
    };

    // PAINEL SUPER ADMIN
    document.getElementById('btn-super-admin').onclick = async () => {
      document.getElementById('admin-modal').style.display = 'flex';

      const usersListContainer = document.getElementById('admin-users-list');
      usersListContainer.innerHTML = "";
      const allUsers = await getDocs(collection(db, "users"));

      allUsers.forEach((uDoc) => {
        const u = uDoc.data();
        const div = document.createElement('div');
        div.className = 'member-item';
        div.innerHTML = `
          <div>
            <strong>${u.name || 'Sem nome'}</strong> <small>(${u.email})</small>
          </div>
          <div>
            <button class="btn-small" onclick="adminChangeName('${u.uid}')">Nome</button>
            <button class="btn-small btn-danger" onclick="adminBanUser('${u.uid}', ${u.banned})">${u.banned ? 'Desbanir' : 'Banir'}</button>
          </div>
        `;
        usersListContainer.appendChild(div);
      });

      const groupsListContainer = document.getElementById('admin-groups-list');
      groupsListContainer.innerHTML = "";
      const allGroups = await getDocs(collection(db, "groups"));

      allGroups.forEach((gDoc) => {
        const g = { id: gDoc.id, ...gDoc.data() };
        const div = document.createElement('div');
        div.className = 'member-item';
        div.innerHTML = `
          <div>
            <strong>${g.name}</strong> <small>(${g.members ? g.members.length : 0} membros)</small>
          </div>
          <div>
            <button class="btn-small" onclick="adminJoinGroup('${g.id}')">Entrar</button>
            <button class="btn-small btn-danger" onclick="adminDeleteGroup('${g.id}')">Excluir</button>
          </div>
        `;
        groupsListContainer.appendChild(div);
      });
    };

    window.adminChangeName = async (uid) => {
      const newName = prompt("Digite o novo nome para este usuário:");
      if (!newName) return;
      await updateDoc(doc(db, "users", uid), { name: newName });
      alert("Nome alterado!");
      closeModal('admin-modal');
    };

    window.adminBanUser = async (uid, currentStatus) => {
      await updateDoc(doc(db, "users", uid), { banned: !currentStatus });
      alert(currentStatus ? "Usuário desbanido!" : "Usuário banido com sucesso!");
      closeModal('admin-modal');
    };

    window.adminJoinGroup = async (groupId) => {
      const groupRef = doc(db, "groups", groupId);
      const groupDoc = await getDoc(groupRef);
      if (groupDoc.exists()) {
        const members = groupDoc.data().members || [];
        if (!members.includes(currentUser.uid)) {
          members.push(currentUser.uid);
          await updateDoc(groupRef, { members });
        }
        alert("Você entrou no grupo!");
        closeModal('admin-modal');
      }
    };
 


    window.adminDeleteGroup = async (groupId) => {
      if (!confirm("Tem certeza que deseja apagar este grupo definitivamente?")) return;
      await deleteDoc(doc(db, "groups", groupId));
      alert("Grupo apagado!");
      closeModal('admin-modal');
    };

    window.closeModal = (modalId) => { document.getElementById(modalId).style.display = 'none'; };
  </script>
</body>
</html>
